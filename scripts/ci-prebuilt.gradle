// CI-only, AGP 8.13.2. Never disable arbitrary tasks to make this guard pass.
// TaskExecutionGraph callbacks must run on EVERY invocation, not be bypassed
// by configuration-cache reuse (gradle.properties enables it by default).
if (gradle.startParameter.configurationCacheRequested) {
    throw new IllegalStateException('prebuilt guard requires configuration cache disabled')
}
gradle.taskGraph.whenReady { graph ->
    def expected = [':app:preBuild', ':app:preDebugAndroidTestBuild',
                    ':app:connectedDebugAndroidTest']
    if (graph.allTasks.collect { it.path } != expected) {
        throw new IllegalStateException('unexpected prebuilt task graph: ' +
            graph.allTasks.collect { it.path }.join(', '))
    }
    // Keep the no-action root hook and AGP's classpath-version verification.
    // TestPreBuildTask/ClasspathComparisonTask only compares dependency maps;
    // it is NOT a compiler. Never exclude it to make this guard pass.
    if (!graph.allTasks[0].actions.empty) {
        throw new IllegalStateException('unexpected prebuilt lifecycle actions')
    }
    def comparison = graph.allTasks[1]
    // AndroidTestTaskManager disables this legacy check when constraints are
    // used (AGP 8.13.2's default). Preserve AGP's decision, never set enabled.
    def constraints = (gradle.rootProject.findProperty('android.dependency.useConstraints')
                       ?: 'true').toString().toBoolean()
    if (comparison.class.superclass.name !=
            'com.android.build.gradle.internal.tasks.TestPreBuildTask' ||
        comparison.actions.size() != 1 || (!comparison.enabled && !constraints)) {
        throw new IllegalStateException('unexpected prebuilt classpath comparison: ' +
            "${comparison.class.name}, actions=${comparison.actions.size()}, enabled=${comparison.enabled}")
    }
    def task = graph.allTasks[2]
    if (!task.enabled || task.ignoreFailures) {
        throw new IllegalStateException('prebuilt guard requires real test execution')
    }
    // AGP consumes these providers, not an independently installed APK. Verify
    // they point at the exact directories whose APK + metadata hashes we check.
    def data = task.testData.get()
    def root = gradle.rootProject.projectDir
    if (data.testApkDir.get().asFile.canonicalFile !=
            new File(root, 'app/build/outputs/apk/androidTest/debug').canonicalFile ||
        data.testedApksDir.get().asFile.canonicalFile !=
            new File(root, 'app/build/outputs/apk/debug').canonicalFile) {
        throw new IllegalStateException('prebuilt APK directories mismatch')
    }
    println('Prebuilt task graph verified: connected tests + classpath check + actionless root')
}
