# Android Lint's UAST pass is metaspace-hungry; 1g OOMs when `check` runs
# lint and the Robolectric unit tests in the same JVM.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Lint's UAST pass and the Robolectric suite both load large class graphs; run
# lint in its own JVM so `check` cannot OOM by running them side by side.
android.experimental.runLintInProcess=false
