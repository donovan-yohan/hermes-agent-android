[versions]
# Toolchain. Pinned deliberately: AGP 8.13.x is the last 8.x line and the one
# this repo's local SDK (platform 36, build-tools 35/36, JDK 17) is proven
# against. Kotlin 2.3.x ships the Compose compiler plugin in-tree.
agp = "8.13.2"
kotlin = "2.3.21"

# AndroidX
desugar = "2.1.5"
androidxCore = "1.17.0"
androidxActivity = "1.11.0"
androidxLifecycle = "2.9.4"
composeBom = "2026.06.01"
datastore = "1.1.7"

# SSH. sshj is the spike's recommendation (docs/spikes/native-kotlin-ssh-client-scope.md §7.2).
# bouncycastle/asn-one come in transitively; they are pinned here so a CVE bump
# is a one-line edit rather than a surprise from sshj's POM.
sshj = "0.40.0"
# bcprov and bcpkix release on slightly different cadences; pin each.
bouncycastleProv = "1.85.2"
bouncycastlePkix = "1.85"
slf4j = "2.0.17"
okhttp = "4.12.0"
media3 = "1.5.1"
kotlinxSerialization = "1.9.0"

# Markdown parsing (CommonMark spec + GFM tables extension).
commonmark = "0.24.0"

# Test
junit = "4.13.2"
kotlinxCoroutines = "1.10.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastleProv" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastlePkix" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Transcript markdown: real CommonMark AST (correct emphasis/nesting) + the
# GFM tables extension, mapped onto our own block model for rendering.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
