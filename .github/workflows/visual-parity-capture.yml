name: Visual parity capture

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact immutable 40-character Android commit SHA to build and capture
        required: true
        type: string
      surface:
        description: Catalogued parity surface
        required: true
        type: choice
        options: [bot-configured-mcp, bot-installed-skills, composer-status-stack, composer-url-chip, composer-add-sheet, session-list-sections, tool-name-aliases, bot-routines, bot-routine-inspector, bot-group-chat, profile-avatars, desktop-sidebar, bot-management, bot-model-config, bot-avatar-editor, bot-steer, notification-latest]
      state:
        description: Catalogued synthetic state (one artifact per dispatch)
        required: true
        type: choice
        options:
          - mcp-loaded
          - mcp-disabled
          - mcp-plugin
          - mcp-unknown
          - mcp-loading
          - mcp-pending
          - mcp-saved
          - mcp-reopened
          - mcp-error
          - mcp-unavailable
          - mcp-refused
          - mcp-empty
          - mcp-unconfirmed
          - skills-loaded
          - skills-disabled
          - skills-loading
          - skills-pending
          - skills-saved
          - skills-reopened
          - skills-error
          - skills-unavailable
          - skills-refused
          - skills-essential
          - skills-empty
          - skills-unconfirmed
          - full-stack-task-list
          - goal-active
          - goal-waiting
          - goal-paused
          - goal-done
          - queue-parked-collapsed
          - background-open
          - url-chip
          - file-chip
          - folder-chip
          - recent-images-populated
          - recent-images-added
          - recent-images-permission
          - pinned-sessions-month-dividers
          - months-scrolled
          - results
          - all-pinned
          - archived-pinned
          - todo-name-aliases
          - populated
          - inspector
          - sparse
          - paused
          - completed
          - overdue
          - overdue-inspector
          - read-failure
          - pause-pending
          - action-rollback
          - resumed
          - deleted
          - profile-ready
          - profile-fallback
          - profile-loading
          - profile-unavailable
          - bots-ready
          - bots-fallback
          - sessions-navigation
          - sessions-navigation-group-selected
          - bot-avatar-loaded
          - bot-avatar-loading
          - bot-avatar-picking
          - bot-avatar-cancel
          - bot-avatar-error
          - bot-avatar-changed
          - bot-avatar-saved
          - bot-avatar-cleared
          - bot-model-loaded
          - bot-model-inventory-loading
          - bot-model-inventory-error
          - bot-model-manual
          - bot-model-confirmation
          - bot-model-saved
          - bot-model-save-refused
          - bot-roster
          - bot-new
          - bot-edit
          - bot-duplicate
          - bot-move
          - bot-section
          - steer-controls
          - latest-preview
          - latest-preview-off
      theme:
        description: Rendered theme
        required: true
        default: dark
        type: choice
        options: [dark, light]

permissions:
  contents: read
jobs:
  instrumented:
    if: github.event.inputs.surface == 'bot-configured-mcp' && github.event.inputs.state == 'mcp-loaded' && github.event.inputs.theme == 'dark' && github.run_attempt == 1 && startsWith(github.ref_name, 'diagnostic/focus-owner-')
    name: disposable failure-only focus diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      # Catalog inputs are approval placeholders only; no visual capture runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Verify immutable diagnostic head
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
          DIAGNOSTIC_BRANCH: ${{ github.ref_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_BRANCH" == diagnostic/focus-owner-* ]] || exit 1
          [[ "$RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$REQUESTED_REF" == "$EVENT_SHA" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_REF" ]] || exit 1
      - name: Bind fresh synthetic run paths
        shell: bash
        run: |
          nonce="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          echo "FOCUS_NONCE=$nonce" >> "$GITHUB_ENV"
          echo "FOCUS_DISPOSABLE=api34-run-scoped-snapshot" >> "$GITHUB_ENV"
          # Action overrides AVD home; isolate with its actual avd-name input.

      - name: Verify disposable launcher preparation contract
        run: python3 -m unittest discover -s scripts/tests -p test_ci_launcher_focus.py -v
      - name: State what this lane proves
        shell: bash
        run: |
          echo 'This emulator lane does not substitute for physical acceptance.'
          echo 'PKCE browser hand-off, real radio, network handoff, TalkBack and media stay on the device matrix.'
          echo 'ActivityScenario.recreate() is a real destroy/recreate, not a system-initiated process kill.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Pinned to a commit: a moving tag on a third-party action is a write
      # into a workflow whose sibling job holds the rolling keystore secret.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      # Without KVM the x86_64 image falls back to software emulation and the
      # lane stops fitting in any sensible timeout.
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator image and AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64-pixel_6-v2
          # Without these a run that ends red saves nothing, so a lane that is
          # red on the first attempt never warms its own cache and every later
          # attempt pays the cold-boot cost again.
          restore-keys: |
            avd-api34-google_apis-x86_64-pixel_6-
      # Finish CPU/memory-heavy APK assembly before either cold or warm boot.
      # Resource isolation only; this is not a proven SystemUI ANR fix.
      - name: Assemble instrumented APKs before emulator boot
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --no-build-cache
          python3 scripts/ci_prebuilt.py record
          python3 -m unittest discover -s scripts/tests -p test_ci_prebuilt.py -v
          python3 -m unittest discover -s scripts/tests -p test_focus_environment_boundary.py -v
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # Pinned to a commit, for the reason given above the setup-android pin.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo 'AVD created; the snapshot is now cacheable.'
      - name: Run the instrumented lane
        # Pinned to a commit, for the reason given above the setup-android pin.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-port: 5554
          disable-animations: true
          # CI-only mitigation for the API34 launcher ANR stealing input focus.
          # Stop only this synthetic AVD's known launcher after normal preparation;
          # the launcher ANR itself remains unfixed. Never stop the app or hide dialogs.
          script: |
            test "$(adb -s "$ANDROID_SERIAL" get-serialno)" = "$ANDROID_SERIAL"
            test "$(adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" = 34
            test "$(adb -s "$ANDROID_SERIAL" shell getprop ro.boot.qemu | tr -d '\r')" = 1
            adb -s "$ANDROID_SERIAL" shell setprop debug.hermes.focus_attestation "$FOCUS_NONCE:$ANDROID_SERIAL:$FOCUS_DISPOSABLE"
            ./scripts/prepare-ci-emulator.sh
            adb -s "$ANDROID_SERIAL" shell am force-stop --user 0 com.google.android.apps.nexuslauncher
            FOCUS_DIAGNOSTIC=true python3 scripts/ci_prebuilt.py connected
      - name: Upload instrumented lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/ci-prebuilt.json
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 1

      - name: Upload only fresh reduced owner records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reduced-focus-${{ github.run_id }}
          path: app/build/focus-${{ env.FOCUS_NONCE }}/readiness-*.json
          if-no-files-found: ignore
          retention-days: 1
