            ${{ runner.temp }}/trial-3.log
            ${{ runner.temp }}/trial-3.exit
            ${{ runner.temp }}/trial-3.sha256
      - name: Preserve aggregate failure
        if: always()
        env:
          OUTCOMES: ${{ steps.trial1.outcome }},${{ steps.trial2.outcome }},${{ steps.trial3.outcome }}
        run: test "$OUTCOMES" = success,success,success
