          script: |
            ./scripts/prepare-ci-emulator.sh
            adb -s "$ANDROID_SERIAL" shell am force-stop --user 0 com.google.android.apps.nexuslauncher
            set +e; nonce="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"; echo "FOCUS_EVIDENCE=app/build/focus-$nonce" >> "$GITHUB_ENV"; adb -s "$ANDROID_SERIAL" shell setprop debug.hermes.focus_attestation "$nonce:emulator-5554:api34-run-scoped-snapshot" && FOCUS_DIAGNOSTIC=true FOCUS_NONCE="$nonce" FOCUS_DISPOSABLE=api34-run-scoped-snapshot python3 scripts/ci_prebuilt.py connected > "$RUNNER_TEMP/trial-2.log" 2>&1; status=$?; cat "$RUNNER_TEMP/trial-2.log"; printf '%s\n' "$status" > "$RUNNER_TEMP/trial-2.exit"; sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/trial-2.sha256"; exit "$status"
      - name: Retain all outcomes trial 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-normal-${{ github.run_id }}-trial-2
          retention-days: 2
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            app/build/ci-prebuilt.json
            ${{ env.FOCUS_EVIDENCE || 'app/build/no-focus-evidence' }}/*.json
            ${{ runner.temp }}/trial-2.log
            ${{ runner.temp }}/trial-2.exit
            ${{ runner.temp }}/trial-2.sha256
      - name: Clear only prior trial reports 3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: rm -rf app/build/outputs/androidTest-results/connected app/build/reports/androidTests/connected
      - name: Create independent snapshot 3
        # Pinned to a commit, for the reason given above the setup-android pin.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: snapshot3
        continue-on-error: true
        with:
          avd-name: focus-${{ github.run_id }}-${{ github.run_attempt }}-3
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo 'AVD created; the snapshot is now cacheable.'
      - name: First normal full suite trial 3
        # Pinned to a commit, for the reason given above the setup-android pin.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        if: ${{ !cancelled() && steps.snapshot3.outcome == 'success' }}
        id: trial3
        continue-on-error: true
        with:
          avd-name: focus-${{ github.run_id }}-${{ github.run_attempt }}-3
