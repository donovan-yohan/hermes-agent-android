name: Android exact-head

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ROLLING_ARTIFACT: hermes-mobile-latest

concurrency:
  group: android-exact-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.apk.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Restore rolling debug keystore
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HERMES_ROLLING_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo '::error::HERMES_ROLLING_DEBUG_KEYSTORE_BASE64 is required for main builds.'
            exit 1
          }
          keystore="$RUNNER_TEMP/rolling-debug.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null
          echo "HERMES_ROLLING_DEBUG_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Check and assemble exact head
        run: ./gradlew check assembleDebug --no-daemon --no-build-cache
      - name: Verify rolling APK signing identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          apk='app/build/outputs/apk/debug/app-debug.apk'
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner" || {
            echo '::error::Android apksigner was not found.'
            exit 1
          }

          certificate="$RUNNER_TEMP/rolling-debug.cer"
          keytool -exportcert \
            -keystore "$HERMES_ROLLING_DEBUG_KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -file "$certificate" >/dev/null
          read -r expected_digest _ < <(sha256sum "$certificate")

          actual_digest="$("$apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$actual_digest" || {
            echo '::error::The APK signing certificate could not be read.'
            exit 1
          }
          if [ "${expected_digest,,}" != "${actual_digest,,}" ]; then
            echo '::error::The APK was not signed by the rolling debug key.'
            exit 1
          fi
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && env.ROLLING_ARTIFACT || format('app-debug-{0}', github.sha) }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove rolling debug keystore
        if: always()
        shell: bash
        run: rm -f "${HERMES_ROLLING_DEBUG_KEYSTORE_PATH:-$RUNNER_TEMP/rolling-debug.keystore}"

  # The instrumented lane. Independent of the APK job on purpose: an emulator
  # failure must not withhold the rolling artifact, and a broken build must not
  # be reported as a device failure. Its scope is stated in the job itself.
  instrumented:
    name: instrumented emulator lane
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: State what this lane proves
        shell: bash
        run: |
          echo 'This emulator lane does not substitute for physical acceptance.'
          echo 'PKCE browser hand-off, real radio, network handoff, TalkBack and media stay on the device matrix.'
          echo 'ActivityScenario.recreate() is a real destroy/recreate, not a system-initiated process kill.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      # Without KVM the x86_64 image falls back to software emulation and the
      # lane stops fitting in any sensible timeout.
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The AVD and its cold snapshot are the expensive part; caching them is
      # what keeps a warm run inside the timeout above.
      - name: Cache the emulator image and AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64-pixel_6-v1
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo 'AVD created; the snapshot is now cacheable.'
      # pixel_6 is pinned, not incidental: the chat surface switches to its wide
      # layout above 720 dp, and OrientationTest asserts the rotated window
      # really crosses that breakpoint rather than passing vacuously.
      - name: Run the instrumented lane
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-build-cache
      - name: Upload instrumented lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-results-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14

  # Separate job so only this one holds `actions: write`, and it runs after the
  # upload so the replacement artifact exists before any older one is deleted.
  prune:
    name: prune superseded latest APKs
    if: github.event_name == 'push'
    needs: check
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove superseded latest APK artifacts
        shell: bash
        env:
          CURRENT_ARTIFACT_ID: ${{ needs.check.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$CURRENT_ARTIFACT_ID" || {
            echo '::error::The rolling APK upload did not return an artifact id.'
            exit 1
          }
          gh api --paginate \
            "repos/${REPOSITORY}/actions/artifacts?name=${ROLLING_ARTIFACT}&per_page=100" \
            --jq ".artifacts[] | select(.id != ${CURRENT_ARTIFACT_ID}) | .id" |
          xargs -r -I{} gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/{}"
