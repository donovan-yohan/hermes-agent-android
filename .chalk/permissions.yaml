# Permissions for agents working in this repo. Rendered by chalkbag into
# .claude/settings.json, .codex/config.toml and opencode.json.
#
# Two rules shape everything here:
#   1. The upstream Hermes checkout is READ-ONLY reference material.
#   2. Nothing secret lives in this repo, and nothing should try to read one.

bash:
  allow:
    - "./gradlew *"
    - "git status*"
    - "git diff*"
    - "git log*"
    - "git show*"
    - "./scripts/check-repo-invariants.sh"
    - "adb devices"
    - "adb logcat*"
  ask:
    - "adb install*"
    - "adb uninstall*"
    - "chalkbag build*"
    - "curl *"
  deny:
    # The reference checkout must never be mutated.
    - "git -C /home/donovanyohan/.hermes/*"
    - "git push --force*"
    - "git push*"
    - "rm -rf *"
    # A key that leaves the device is a key that has to be rotated.
    - "ssh-keygen *"
    - "cat ~/.ssh/*"

read:
  allow:
    - "./app/**"
    - "./docs/**"
    - "./scripts/**"
    - "./.chalk/**"
    - "./gradle/**"
    # Pinned upstream reference. Read-only by policy and by the bash rules above.
    - "/home/donovanyohan/.hermes/hermes-agent/**"
  deny:
    - "~/.ssh/**"
    - "**/*.pem"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/.env"
    - "**/.env.*"

write:
  allow:
    - "./app/**"
    - "./docs/**"
    - "./scripts/**"
    - "./.chalk/**"
    - "./gradle/**"
    - "./AGENTS.md"
    - "./README.md"
    - "./build.gradle.kts"
    - "./settings.gradle.kts"
    - "./gradle.properties"
  deny:
    # Upstream, credentials, and chalkbag's generated output.
    - "/home/donovanyohan/.hermes/**"
    - "~/.ssh/**"
    - "./.agents/**"
    - "./.claude/**"
    - "./.codex/**"
    - "./.opencode/**"
    - "./opencode.json"

webfetch:
  allow:
    - "domain:developer.android.com"
    - "domain:developers.google.com"
    - "domain:github.com"
    - "domain:maven.org"
    - "domain:repo1.maven.org"
    - "domain:dl.google.com"
  deny:
    - "domain:*"

defaultMode: "default"

sandbox:
  mode: "workspace-write"
  # Gradle resolves dependencies from Google Maven and Maven Central.
  networkAccess: true

# The upstream Hermes checkout, so read rules above can reach it.
additionalRoots:
  - "/home/donovanyohan/.hermes/hermes-agent"
