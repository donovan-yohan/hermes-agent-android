# Permissions for agents working in this repo. Rendered by chalkbag into
# .claude/settings.json, .codex/config.toml and opencode.json.
#
# Two rules shape everything here:
#   1. The upstream Hermes checkout is READ-ONLY reference material.
#   2. Nothing secret lives in this repo, and nothing should try to read one.

bash:
  allow:
    - "./gradlew *"
    - "git status*"
    - "git diff*"
    - "git log*"
    - "git show*"
    - "./scripts/check-repo-invariants.sh"
    # The repo gates and the capture scripts are run directly, by name.
    - "python3 scripts/*"
    - "python3 .chalk/skills/*"
    - "node .chalk/skills/*"
    - "adb devices"
    - "adb logcat*"
  ask:
    # A visual-parity capture needs Desktop's tree at a pin, which means a
    # clone — but `git clone` is not a read. `--upload-pack=<cmd>` and
    # `-c protocol.ext.allow=always ext::sh -c <cmd>` each execute an arbitrary
    # command, and nothing constrains the destination, so `--bare` into the
    # reference checkout is spellable. It prompts, once per review.
    - "git clone*"
    - "adb install*"
    - "adb uninstall*"
    - "chalkbag build*"
    - "curl *"
  deny:
    # The reference checkout must never be mutated.
    - "git -C ~/.hermes/*"
    - "git push --force*"
    - "git push*"
    - "rm -rf *"
    # A key that leaves the device is a key that has to be rotated.
    - "ssh-keygen *"
    - "cat ~/.ssh/*"

read:
  allow:
    - "./app/**"
    - "./docs/**"
    - "./scripts/**"
    - "./.chalk/**"
    - "./gradle/**"

  deny:
    # Codex accepts exact paths and subtree patterns for deny rules, not
    # filename globs such as **/*.pem. Keep the real credential stores closed;
    # AGENTS.md and the tracked-file invariant prohibit secret fixtures here.
    - "~/.ssh/**"
    - "./.env"
    - "./secrets/**"
    - "./id_rsa"
    - "./id_ed25519"

write:
  allow:
    - "./app/**"
    - "./docs/**"
    - "./scripts/**"
    - "./.chalk/**"
    - "./gradle/**"
    - "./AGENTS.md"
    - "./README.md"
    - "./build.gradle.kts"
    - "./settings.gradle.kts"
    - "./gradle.properties"
  deny:
    # Credentials and chalkbag's generated output.
    - "~/.ssh/**"
    - "./.agents/**"
    - "./.claude/**"
    - "./.codex/**"
    - "./.opencode/**"
    - "./opencode.json"

webfetch:
  allow:
    - "domain:developer.android.com"
    - "domain:developers.google.com"
    - "domain:github.com"
    - "domain:maven.org"
    - "domain:repo1.maven.org"
    - "domain:dl.google.com"
  deny:
    - "domain:*"

defaultMode: "default"

sandbox:
  mode: "workspace-write"
  # Gradle resolves dependencies from Google Maven and Maven Central.
  networkAccess: true
